name: personal-stack

services:
  redis:
    image: redis:7.0-alpine
    container_name: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --protected-mode
      - "no"
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /srv/pip/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - personal-network

  personal:
    build:
      context: ./personal
      args:
        DEBIAN_BASE: bookworm
        FRAPPE_BENCH_VERSION: 5.31.0
        INSTALL_CHROMIUM: "true"
        NODE_VERSION: 24.13.0
        PYTHON_VERSION: 3.14.2
        WKHTMLTOPDF_AMD64_SHA256: 98ba0d157b50d36f23bd0dedf4c0aa28c7b0c50fcdcdc54aa5b6bbba81a3941d
        WKHTMLTOPDF_DISTRO: bookworm
        WKHTMLTOPDF_VERSION: 0.12.6.1-3
    image: personal:runtime
    container_name: personal
    user: "0:0"
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      FRAPPE_SSH_PASSWORD: ${PERSONAL_SSH_FRAPPE_PASSWORD:-}
      ROOT_SSH_PASSWORD: ${PERSONAL_SSH_ROOT_PASSWORD:-}
      PATH: /home/frappe/.local/bin:/home/frappe/.nvm/versions/node/v24.13.0/bin:/home/frappe/frappe-bench/env/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      PYTHONUNBUFFERED: "1"
      USE_PROXY: "1"
    ports:
      - "22222:22222"
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
    volumes:
      - /srv/pip/frappe-bench:/home/frappe/frappe-bench
      - /srv/pip/frappe-ssh:/home/frappe/.ssh
      - /srv/pip/ssh-host-keys:/etc/ssh/host-keys:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -H 'Host: pip.lly.info' http://127.0.0.1:8000/api/method/ping >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - personal-network

  mcp:
    build:
      context: ./mcp-sidecar
    image: personal-mcp:runtime
    container_name: personal-mcp
    restart: unless-stopped
    env_file:
      - /srv/pip/mcp.env
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      personal:
        condition: service_healthy
    networks:
      - personal-network

  nginx:
    image: nginx:1.26-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/pip/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/pip/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/pip/nginx/ssl:/etc/nginx/ssl:ro
      - /srv/pip/nginx/logs:/var/log/nginx
      - /srv/pip/frappe-bench:/home/frappe/frappe-bench:ro
    depends_on:
      mcp:
        condition: service_healthy
      personal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-check-certificate --header='Host: pip.lly.info' -q -O /dev/null https://127.0.0.1/api/method/ping || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - personal-network

networks:
  personal-network:
    name: personal-network
    driver: bridge
