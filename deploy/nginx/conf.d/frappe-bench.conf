upstream frappe-bench-web {
	server personal:8000 fail_timeout=60s;
}

upstream frappe-bench-socketio {
	server personal:9000 fail_timeout=60s;
}

upstream personal-mcp {
	server mcp:8000 fail_timeout=60s;
}

server {
	listen 80;
	server_name pip.lly.info;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name pip.lly.info;

	root /home/frappe/frappe-bench/sites;

	ssl_certificate /etc/nginx/ssl/pip.lly.info_bundle.crt;
	ssl_certificate_key /etc/nginx/ssl/pip.lly.info.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin" always;

	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;

	location /assets {
		try_files $uri =404;
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /pip.lly.info/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name pip.lly.info;
		proxy_set_header Origin $scheme://$http_host;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://frappe-bench-socketio;
	}

	location = /.well-known/oauth-protected-resource/mcp {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://personal-mcp;
	}

	location /mcp {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 3600;
		proxy_pass http://personal-mcp;
	}

	location / {
		rewrite ^(.+)/$ $1 permanent;
		rewrite ^(.+)/index\.html$ $1 permanent;
		rewrite ^(.+)\.html$ $1 permanent;

		location ~* ^/files/.*\.(htm|html|svg|xml) {
			add_header Content-Disposition "attachment";
			try_files /pip.lly.info/public/$uri @webserver;
		}

		try_files /pip.lly.info/public/$uri @webserver;
	}

	location @webserver {
		proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name pip.lly.info;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://frappe-bench-web;
	}

	client_max_body_size 50m;
	client_body_buffer_size 16k;
	client_header_buffer_size 1k;
}
