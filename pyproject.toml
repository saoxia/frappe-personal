[project]
name = "personal"
description = "Personal information management system"
authors = [
    { name = "Personal", email = "lingyu_li@foxmail.com" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "frappe-mcp==0.1.0; python_version < '3.14'",
]
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "personal"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
flow = ">=0.0.1,<1.0.0"
